<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TÍTULO}}</title>
<!--
  Base dos relatórios de avaliar-cv e apoio-entrevista.
  Copie este arquivo, troque os {{CAMPOS}} e remova as seções que não se aplicam.
  Classes úteis: .score, .badge.ok / .badge.parcial / .badge.falta, .card, .grid
-->
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1d2330; --muted: #5c6575;
    --border: #e3e6eb; --accent: #004f90;
    --ok: #1a7f4b; --ok-bg: #e5f4ec; --mid: #9a6400; --mid-bg: #fdf1dc;
    --bad: #b42318; --bad-bg: #fdeceb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --surface: #1b2029; --text: #e8ebf0; --muted: #9aa3b2;
      --border: #2c333f; --accent: #6cb4ff;
      --ok: #5fd39a; --ok-bg: #173327; --mid: #f0b55a; --mid-bg: #3a2d14;
      --bad: #ff8a80; --bad-bg: #3d1d1b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  header { margin-bottom: 24px; }
  header p { color: var(--muted); margin: 4px 0 0; }
  h1 { font-size: 1.6rem; margin: 0; }
  h2 { font-size: 1.15rem; margin: 0 0 12px; color: var(--accent); }
  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .score strong { font-size: 3rem; line-height: 1; color: var(--accent); }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px;
           font-size: .8rem; font-weight: 600; white-space: nowrap; }
  .badge.ok { color: var(--ok); background: var(--ok-bg); }
  .badge.parcial { color: var(--mid); background: var(--mid-bg); }
  .badge.falta { color: var(--bad); background: var(--bad-bg); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .85rem; }
  ul { margin: 0; padding-left: 20px; }
  li + li { margin-top: 6px; }
  .muted { color: var(--muted); font-size: .9rem; }
  @media (max-width: 560px) { th:nth-child(3), td:nth-child(3) { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>{{TÍTULO}}</h1>
    <p>{{EMPRESA}} · {{VAGA}} · {{DATA}}</p>
  </header>

  <section class="card score">
    <strong>{{NOTA}}</strong>
    <span class="badge ok">{{FAIXA}}</span>
    <p class="muted">{{COMO_A_NOTA_FOI_CALCULADA}}</p>
  </section>

  <section class="card">
    <h2>Resumo</h2>
    <p>{{RESUMO}}</p>
  </section>

  <section class="card">
    <h2>Requisitos</h2>
    <table>
      <thead><tr><th>Requisito</th><th>Status</th><th>Evidência no CV</th></tr></thead>
      <tbody>
        <tr><td>{{REQUISITO}}</td><td><span class="badge ok">Atende</span></td><td>{{EVIDÊNCIA}}</td></tr>
      </tbody>
    </table>
  </section>

  <div class="grid">
    <section class="card"><h2>Pontos fortes</h2><ul><li>{{...}}</li></ul></section>
    <section class="card"><h2>Pontos a melhorar</h2><ul><li>{{...}}</li></ul></section>
  </div>

  <section class="card">
    <h2>Próximos passos</h2>
    <ul><li>{{...}}</li></ul>
  </section>
</main>
</body>
</html>
