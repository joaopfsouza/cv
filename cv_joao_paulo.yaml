    #    ACQIO) e Data Factory/Synapse/Databricks (seguem na Kumulus, criados pelo portal).
    #    Azure DevOps é a ferramenta principal; GitHub Actions e GitLab CI/CD foram POCs.
    #    Python ficou como estudo: "tenho apenas estudo e consigo lidar com código". ──
    conhecimentos:
    - label: Orquestração & Containers
      details: Kubernetes (AKS), Docker, Helm
    - label: Plataformas Cloud
      details: Azure Cloud (AKS, ACI, App Services, App Gateway, Entra ID), AWS
    - label: Infraestrutura como Código (IaC)
      details: Terraform, Bicep, ARM Templates
    - label: CI/CD & Automação
      details: Azure DevOps (TFS/Azure DevOps Server); GitHub Actions e GitLab CI/CD (POC)
    - label: Linguagens de Programação & Scripting
      details: PowerShell, Bash, YAML, JSON, HCL, Python (estudos)
    - label: Segurança & Qualidade
      details: SonarQube, SAST (Checkmarx), DAST (Acunetix), SSL/TLS
    - label: Banco de Dados & Mensageria
      details: PostgreSQL, SQL Server, Elastic Cloud, Kafka, Debezium
    - label: Metodologias & Frameworks
      details: SAFe, SCRUM, Kanban, ITIL

