cv:
  name: João Paulo Ferreira de Souza
  # ── AUDIT: headline estava vazio — preenchido com keywords de alto impacto ──
  # ── REVISÃO 2026-10-13 (honestidade): o headline agora segue o que ele fez de fato,
  #    nesta ordem: Azure, Azure DevOps, CI/CD, Terraform e Kubernetes. Saíram AWS
  #    (participou com o time), Python ("profissionalmente, não realizei nenhum código")
  #    e "Certified: 3x Azure", que continua no resumo e em Certificações. ──
  headline: "Engenheiro DevOps | Azure | Azure DevOps | CI/CD | Terraform | Kubernetes"
  location: Itapecerica da Serra, SP
  email: joao.ferreiradesouza@gmail.com
  photo:
  phone: +55 (11) 91921-5622
  website:
  social_networks:
    - network: LinkedIn
      username: joaopfsouza
  custom_connections:
  sections:

    # ── AUDIT v4: resumo atualizado com o texto publicado no LinkedIn ──
    # ── REVISÃO 2026-10-13 (honestidade): tirado o tom de sênior ("Especialista em
    #    ecossistema Azure", "transformando infraestruturas complexas em ecossistemas",
    #    "larga escala", "especialização em... Kubernetes em produção"). O texto agora
    #    descreve o que ele fez de fato, com destaque para CI/CD, Terraform/IaC e a
    #    trajetória na Kroton. Nenhum fato novo; keywords de ATS mantidas. ──
    resumo:
      - "Engenheiro DevOps com mais de 7 anos de experiência em CI/CD, infraestrutura como código e nuvem Azure. Comecei como estagiário na Kroton Educacional, passei a analista e fui promovido a engenheiro, sempre construindo e mantendo pipelines para vários times. Formado em Engenharia Elétrica pela UNESP."
      - "Trabalhei nos setores de educação, tecnologia e fintech, atendendo vários times ao mesmo tempo em modelos SAFe e Scrum. Tenho vivência com Docker, Kubernetes (AKS) e Helm em pipelines de deploy, e com ambientes Azure e AWS."

      - "**Cloud & IaC**: Azure como plataforma principal, com provisionamento via Terraform, Bicep e ARM Templates."

      # ── REVISÃO 2026-10-13 (honestidade): Azure DevOps é a ferramenta que ele usou de
      #    fato; GitHub Actions e GitLab CI/CD foram POCs na Kumulus. Python saiu da
      #    automação: ele só estudou ("profissionalmente, não realizei nenhum código"). ──
      - "**CI/CD & Automação**: Criação e manutenção de pipelines no Azure DevOps para diversas tecnologias, com POCs em GitHub Actions e GitLab CI/CD. Automação com PowerShell e Shell Script."

      # ── REVISÃO 2026-10-13 (honestidade): SonarQube ele integrou aos pipelines na Kroton
      #    e na Solutis. Em SAST/DAST ele apoiou a avaliação das ferramentas e ajudou a
      #    consultoria nas primeiras implantações (Kroton); não foi ele quem integrou. ──
      - "**DevSecOps & Qualidade**: Integração do SonarQube aos pipelines de CI/CD em várias empresas. Apoio na avaliação de ferramentas de SAST e DAST e nas primeiras implantações do Checkmarx e do Acunetix nos pipelines. Vivência em ambiente com requisitos PCI DSS."

      - "**Operação & Sustentação**: Sustentação de ambientes de produção e administração do Azure DevOps e do SonarQube. Vivência em ambiente com processos ITIL."

      - "**Certificações Microsoft**: DevOps Engineer Expert (AZ-400) · Azure Administrator Associate (AZ-104) · Azure Fundamentals (AZ-900)"

    # ── AUDIT v4: objetivo sem menção a nível de senioridade ──
    objetivo:
      - "Atuar como Engenheiro DevOps em times que valorizem automação, qualidade e entrega contínua de valor em ambientes multi-cloud."

    formação:
      - institution: Universidade Estadual Paulista (UNESP)
        area: Engenharia Elétrica
        degree: Grad.
        date:
        start_date: 2011
        end_date: 2018
        location: Bauru, SP
        summary:
        # ── AUDIT: adicionada Iniciação Científica como diferencial ──
        highlights:
          - "Bolsista PIBIC/REITORIA/UNESP (2012–2013): pesquisa em Algoritmos Multiagentes aplicados a Robôs Móveis com sensores ultrassom e infravermelho."

    experiências:
      - company: ACQIO
        position: ENGENHEIRO DEVOPS
        date:
        start_date: 2024-07
        end_date: 2026-05
        location: São Paulo, SP
        # ── REVISÃO 2026-10-13 (honestidade): cada item foi classificado pelo João Paulo
        #    como "fiz", "participei com o time" ou "acompanhei", e o verbo agora mostra
        #    esse papel. Itens que ele fez vêm primeiro. Saíram: automação de agentes
        #    ("não fiz isso"), "10+ ambientes" nos certificados (trocou alguns, sem
        #    quantidade), "monitoração contínua para alta disponibilidade" e os resultados
        #    do item de modernização (drift, onboarding).
        #    O que ele só acompanhou ficou num bullet curto no fim.
        #    Fechamento 2026-10-13: Dependency Check voltou como POC rápida ("fiz apenas
        #    uma poc rapida"); certificados ganharam a wiki com o passo a passo; Operação
        #    inclui a administração de Azure DevOps e SonarQube em ambiente auditado por
        #    PCI DSS ("permissões, criava recurso ... realizava configurações e atualização").
        #    A adequação ao PCI DSS em si continua como "acompanhei". ──
        summary: "Time de Infraestrutura e DevOps de uma fintech, com ambiente principal em Azure. Atuei em migrações, pipelines de CI/CD, Terraform e sustentação de produção."
        highlights:
          - "**Dados & Mensageria**: Migrei o PostgreSQL de Single Server para Flexible Server no Azure. Recebi pronto o conector Debezium/Kafka que integra SQL Server ao Elastic Cloud e fiz os testes, as validações e o deploy em produção."
          - "**CI/CD & Automação**: Participei com o time da criação de pipelines de build e deploy no Azure DevOps para aplicações Kotlin, Go e Django, com Docker e deploy em Kubernetes via Helm. Fiz POCs rápidas de Dependency Check, para análise de dependências, e de IA para code review em Pull Requests."
          - "**Modernização & IaC**: Participei com o time da migração de Cloud Services legados para containers (ACI e App Services), com provisionamento em Terraform."
          - "**Segurança**: Troquei os certificados SSL/TLS de AKS, App Gateway e Cloud Services, em contato com os fornecedores, e criei uma wiki com o passo a passo da troca. Participei com o time da integração do SonarQube com o Entra ID via SAML."
          - "**Redes**: Atualizei o Terraform de uma VPN Site-to-Site já existente para incluir uma nova configuração e renovei o certificado de cliente da VPN Point-to-Site."
          # ── AUDIT: FinOps reescrito — participação real foi acompanhamento/monitoramento,
          #    não liderança direta. Números removidos por honestidade ──
          - "**FinOps**: Acompanhei e monitorei iniciativas de otimização de custos, incluindo redimensionamento de recursos ociosos e gestão de Reserved Instances (Reservations) no Azure e Databricks, contribuindo para a visibilidade financeira da nuvem."
          - "**Operação**: Administrei o ambiente Azure e, em ambiente auditado por PCI DSS, o Azure DevOps e o SonarQube (permissões, criação de recursos, configurações e atualizações). Participei com o time da administração de AWS, Elastic Cloud, Kubernetes e MongoDB Atlas. Sustentação de produção e participação nos ritos Scrum."
          - "**Também acompanhei**: a adequação ao PCI DSS, a migração de versão do ExpressRoute e a monitoração no Elastic, onde fiz alguns gráficos como aprendizado."

      - company: SOLUTIS TECNOLOGIAS
        position: ANALISTA DE DEVOPS
        date:
        start_date: 2023-06
        end_date: 2024-06
        location: Salvador, BA
        # ── REVISÃO 2026-10-13 (honestidade): o João Paulo confirmou que fez tudo do
        #    item de ponto focal ("Realizei todas essas atividades") e a automação
        #    ("Usando scripts na pipeline para algumas tarefas. Fiz"), que agora aparece
        #    no tamanho real, sem "processos críticos" nem resultado. Saíram a investigação
        #    de falhas, o "P1 abaixo de 2h", "garantir disponibilidade" e os SLAs ("não
        #    participava desses problemas"). "Acompanhava raramente alguns deploys em
        #    produção" ficou de fora: é pouco para um bullet e a sustentação já aparece
        #    na ACQIO. "Domínio do Azure DevOps Server 2022" virou o que ele fazia
        #    (pipelines e templates); a administração do servidor não era dele. ──
        summary: "Ponto focal de DevOps para vários times de desenvolvimento, em um ambiente com processos ITIL."
        highlights:
          - "Configurei pipelines de CI/CD, criei repositórios e integrei o SonarQube para os times que atendia, além de ajudar a difundir a cultura DevOps entre eles."
          - "Construí pipelines e templates no Azure DevOps Server 2022 e usei scripts PowerShell nos pipelines para automatizar algumas tarefas."

      - company: KUMULUS
        position: ANALISTA CLOUD & DEVOPS
        date:
        start_date: 2022-06
        end_date: 2023-02
        location: Campinas, SP
        # ── REVISÃO 2026-10-13 (honestidade): o João Paulo classificou cada item.
        #    Pipelines no Azure DevOps e IaC (Bicep/ARM e Terraform) para dev, homologação
        #    e produção: "FIZ". GitHub Actions e GitLab CI/CD: "POC". Data Factory, Synapse
        #    e Databricks: "Fiz a criação via portal da Azure", sem pipelines de dados nem
        #    IaC desses recursos. Infraestrutura no Azure e apoio com Git: "FIZ".
        #    Saíram os resultados que ele não informou (padronização da entrega, menos
        #    inconsistência entre ambientes, tempo de provisionamento, drift, onboarding
        #    de projetos de analytics) e o "evolução" da infraestrutura.
        #    Fechamento 2026-10-13: "Sim a Kumulus é uam consultoria" e "não [mantinha],
        #    pois era consultoria e entregava o projeto pronto para o cliente". O summary
        #    agora diz que é consultoria e os pipelines ficam só com "Criei". ──
        summary: "Consultoria em Azure e DevOps: projetos de infraestrutura e CI/CD entregues prontos para clientes variados."
        highlights:
          - "Criei pipelines de CI/CD no Azure DevOps para aplicações .NET Core, .NET Framework, Node.js e Angular. Fiz POCs de GitHub Actions e GitLab CI/CD."
          - "Escrevi a infraestrutura como código, com Bicep/ARM Templates e Terraform, para os ambientes de desenvolvimento, homologação e produção dos projetos."
          - "Provisionei pelo portal do Azure os recursos de Data Factory, Synapse Analytics e Databricks para projetos de dados e Data Science."
          - "Implantei infraestrutura no Azure e apoiei os times de desenvolvimento no uso do Git."

      - company: KROTON EDUCACIONAL
        position: ENGENHEIRO DEVOPS
        date:
        start_date: 2019-11
        end_date: 2021-10
        location: São Paulo, SP
        # ── REVISÃO 2026-10-13 (honestidade): o João Paulo classificou cada item.
        #    Pipelines: Docker, Kubernetes, .NET Core, .NET Framework, Node.js, Python,
        #    Gradle e Maven "(fiz)"; PHP e SQL Server "(Participei)"; PL/SQL "Fiz a build e
        #    participei na construção do deploy". Saiu "cobrindo todas as tecnologias do
        #    portfólio", que não dá para afirmar, e o "em escala" do título.
        #    IaC com ARM Templates e Terraform por pipeline no Azure DevOps: "(FIZ)"; saiu
        #    o resultado não informado (padronizar e agilizar novos ambientes).
        #    SAST/DAST: "Apoiei e acompanhei consultorias para avaliar ferramentas de SAST e
        #    DAST. E ajudei a consultoria nas primeiras implantações". Saíram "Conduzi
        #    consultoria", "implementei" e "elevando o nível de segurança".
        #    Promoção, responsabilidade técnica por CI/CD e IaC e System Team com 5 a 10
        #    squads: "Está correto". Os 5 a 10 times ficaram só no bullet de SAFe, para
        #    não repetir no summary; saíram "garantindo" e "larga escala".
        #    Fechamento 2026-10-13: manutenção dos pipelines "Na Kroton, sim", então o
        #    bullet de CI/CD voltou a "Criei e mantive" (só a parte dele). Checkmarx e
        #    Acunetix ficam em Conhecimentos: ele consegue explicar numa entrevista como
        #    entraram no pipeline ("Sim"). ──
        summary: "Promovido a engenheiro no mesmo time, com responsabilidade técnica por CI/CD e IaC em vários repositórios."
        highlights:
          - "**CI/CD**: Criei e mantive pipelines no Azure DevOps para Docker, Kubernetes, .NET Core, .NET Framework, Node.js, Python, Gradle e Maven, além da build de PL/SQL. Participei com o time dos pipelines de PHP e SQL Server e da construção do deploy de PL/SQL."
          - "**IaC**: Provisionei ambientes Azure com ARM Templates e Terraform, executados por pipeline no Azure DevOps."
          - "**Segurança**: Apoiei e acompanhei as consultorias que avaliaram ferramentas de SAST e DAST e ajudei a consultoria nas primeiras implantações do Checkmarx (SAST) e do Acunetix (DAST) nos pipelines de várias aplicações."
          - "**SAFe**: Fiz parte do System Team, apoiando a integração contínua entre 5 e 10 squads."

      - company: KROTON EDUCACIONAL
        position: ANALISTA DEVOPS
        date:
        start_date: 2018-08
        end_date: 2019-11
        location: Valinhos, SP
        # ── REVISÃO 2026-10-13 (honestidade): o João Paulo classificou cada item.
        #    Azure DevOps: "Apenas construia os pipelines". Saiu "Gerenciei"; ficou a
        #    construção de pipelines no TFS 2018/VSTS com PowerShell para vários times.
        #    Agentes de build e SonarQube/SonarCloud com quality gates: "FIZ".
        #    Práticas DevOps nos times: "Fiz"; System Team e SAFe saíram desta entrada
        #    porque já aparecem no resumo e na entrada de Engenheiro, e saiu o "garantindo".
        #    Co-orientação: "Pode retirar essse 'demonstrou confiança da liderança'".
        #    Saíram essa frase e o "logo no início da carreira CLT". Summary encurtado. ──
        summary: "Efetivado no mesmo time de DevOps ao fim do estágio."
        highlights:
          - "Construí pipelines de CI/CD no TFS 2018/VSTS (atual Azure DevOps), com scripts PowerShell, para vários times de desenvolvimento."
          - "Configurei agentes de build Windows e Linux para o TFS 2018 e integrei os pipelines ao SonarQube/SonarCloud, com quality gates para vários projetos."
          - "Implantei práticas DevOps nas squads de desenvolvimento, com foco em integração contínua."
          - "Co-orientei estagiários do time e ajudei a difundir a cultura DevOps na empresa."

      - company: KROTON EDUCACIONAL
        position: ESTÁGIO DEVOPS
        date:
        start_date: 2017-07
        end_date: 2018-08
        location: Valinhos, SP
        # ── REVISÃO 2026-10-13 (honestidade): o João Paulo classificou cada item.
        #    Automação do deploy on-premises: "FIZ". Ficaram a troca dos deploys manuais,
        #    a redução de erros e a ligação com o CI que evoluiu depois, sem números e sem
        #    o travessão. Builds .NET e PL/SQL com SonarQube: "(FIz Melhorias)", então
        #    "Criei" virou "Fiz melhorias" e saiu "estabelecendo padrões de qualidade de
        #    código desde o início da esteira". Branches, permissões e versionamento no
        #    TFS: "FIZ"; "Apoiei... contribuindo para a organização" virou "Gerenciei".
        #    Summary encurtado, sem "um dos maiores grupos educacionais do Brasil". ──
        summary: "Estágio no time de DevOps, com automação de deploy, builds e versionamento no TFS."
        highlights:
          - "Automatizei o deploy on-premises com PowerShell e TFS 2015/TFS 2018, substituindo os deploys manuais e reduzindo erros de entrega. Essa automação foi a base do CI que evoluiu nos anos seguintes."
          - "Fiz melhorias nas builds .NET e PL/SQL Oracle, com análise de qualidade no SonarQube."
          - "Gerenciei branches, permissões e versionamento de código no TFS para vários times."

    certificações:
      - bullet: "**[Microsoft Certified: DevOps Engineer Expert (AZ-400)](https://learn.microsoft.com/api/credentials/share/en-us/joaosouza/9660F77B9114B416?sharingId=F7B7E665059A29E2)** **(07/2023 a 07/2027)**"
      - bullet: "**[Microsoft Certified: Azure Administrator Associate (AZ-104)](https://learn.microsoft.com/api/credentials/share/en-us/joaosouza/D7D6B5A081CD8300?sharingId=F7B7E665059A29E2)** **(01/2023 a 01/2028)**"
      - bullet: "**[Microsoft Certified: Azure Fundamentals (AZ-900)](https://learn.microsoft.com/api/credentials/share/en-us/joaosouza/7EE61E852D2840A1?sharingId=F7B7E665059A29E2)** **(2020)**"
      - bullet: "**DevOps Essentials — 4Linux** **(2021 — 20 horas)**"
      - bullet: "**[Introdução ao DevOps — desenvolvedor.io](https://desenvolvedor.io/certificado/d27fd066-071a-458b-9a74-51dd9bf858fa)** **(2020 — 40 horas)**"

    idiomas:
